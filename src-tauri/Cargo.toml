[package]
name = "biliobs"
version = "0.1.0"
description = "B站 OBS 开播助手"
authors = ["Litten"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"

[lib]
# `_lib` 后缀用于避免 Windows 上 lib 与 bin 重名，见 https://github.com/rust-lang/cargo/issues/8519
name = "biliobs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "multipart"] }
tokio = { version = "1", features = ["sync", "time"] }
md-5 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
obws = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Linux 上通过 Secret Service（如 GNOME Keyring）保存凭据；不加这个特性会退回到不落盘的内存存储。
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
