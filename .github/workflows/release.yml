# 构建各平台安装包。
#
# - 推送形如 v0.1.0 的标签：构建后创建一个「草稿」Release 并上传安装包，
#   需要到 GitHub 的 Releases 页面检查无误后手动点击发布。
# - 在 Actions 页面手动运行：只构建，不创建 Release，安装包作为本次运行的产物供下载，
#   用来在正式发布前验证打包是否正常。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils \
            libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 校验标签与应用版本一致
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 tauri.conf.json 中的版本 $version 不一致"
            exit 1
          fi

      # Intel 版是在 Apple 芯片的机器上交叉编译的，测试程序无法直接运行，跳过。
      - name: 运行测试
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}

      # 推送标签时：构建并上传到草稿 Release
      - name: 构建并上传到草稿 Release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BiliOBS ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          releaseBody: |
            ## 安装说明

            安装包没有做代码签名，首次打开时系统会拦截：

            - **macOS**：把应用拖进「应用程序」后，在终端执行
              `xattr -cr /Applications/BiliOBS.app`，然后正常打开。
              Apple 芯片请下载 `aarch64` 版本，Intel 芯片请下载 `x64` 版本。
            - **Windows**：出现「Windows 已保护你的电脑」时，点击「更多信息 → 仍要运行」。

            使用前请阅读 README 中的风险与免责声明。

      # 手动运行时：只构建，产物挂在本次运行上
      - name: 仅构建
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }}

      - name: 上传构建产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: biliobs-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
